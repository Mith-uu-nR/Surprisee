<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A scrapbook for you</title>
<link href="https://fonts.googleapis.com/css2?family=Yeseva+One&family=Caveat:wght@500;700&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#10343c;--bg2:#1b5560;--ink:#f8f1e3;--gold:#eab23e;--rani:#d9468a;--dim:#b2cfcc;--paper:#fbf4e4;--pen:#3b2f2a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);background-image:radial-gradient(circle at 20% 0,var(--bg2),transparent 60%);color:var(--ink);font:400 17px/1.6 Figtree,system-ui,sans-serif}
h1,h2{font-family:'Yeseva One',Georgia,serif;font-weight:400;color:var(--gold);margin:0}
.hand{font-family:Caveat,'Segoe Print',cursive;font-weight:500}
main{max-width:680px;margin:0 auto;padding:0 18px 60px}
.cover{min-height:92vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.cover h1{font-size:clamp(2.6rem,11vw,4.6rem);line-height:1.05}
.cover p{color:var(--dim);max-width:30ch;margin:14px 0 0}
.cover .hint{margin-top:34px;color:var(--gold);font-size:1.4rem;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(8px)}}
.beads{display:flex;gap:6px;margin-top:22px}
.beads i{width:10px;height:10px;border-radius:50%;background:var(--gold)}.beads i:nth-child(even){background:var(--rani)}
section{margin:56px 0}
section>h2{font-size:1.9rem;margin-bottom:18px;text-align:center}
.reveal{opacity:0;transform:translateY(24px);transition:opacity .8s,transform .8s}
.reveal.in{opacity:1;transform:none}
.page{background:var(--paper);color:var(--pen);border-radius:8px;padding:26px 24px;box-shadow:0 10px 26px rgba(0,0,0,.35);white-space:pre-line}
.page.hand{font-size:1.45rem;line-height:1.4}
.polas{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:30px 22px}
.pola{all:unset;cursor:pointer;display:block;background:#fff;padding:12px 12px 16px;box-shadow:0 8px 22px rgba(0,0,0,.4);position:relative;transform:rotate(var(--r,0deg))}
.pola:focus-visible{outline:3px solid var(--rani);outline-offset:4px}
.pola::before{content:"";position:absolute;top:-12px;left:50%;width:84px;height:26px;margin-left:-42px;background:rgba(234,178,62,.75);transform:rotate(-3deg)}
.pola img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;background:#ddd}
.pola .cap{color:var(--pen);margin:10px 4px 0;font-size:1.3rem;line-height:1.25}
.pola small{display:block;margin:6px 4px 0;color:#7a6c60;font-size:.8rem}
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:18px}
.note{padding:22px 18px;color:var(--pen);font-size:1.45rem;line-height:1.25;box-shadow:0 6px 16px rgba(0,0,0,.35);transform:rotate(var(--r,0deg));background:var(--c,#f9d56e)}
.voices{display:grid;gap:16px}
.voice{background:rgba(255,255,255,.08);border-left:4px solid var(--rani);border-radius:6px;padding:16px 18px}
.voice b{display:block;color:var(--gold);margin-top:8px;font-weight:600}
.voice audio{width:100%;margin-top:10px}
.songs{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.songs li{display:flex;gap:14px;align-items:flex-start;background:rgba(255,255,255,.08);border-radius:10px;padding:14px 16px}
.songs .n{flex:none;width:34px;height:34px;border-radius:50%;background:var(--rani);display:grid;place-items:center;font-weight:600}
.songs strong{display:block;color:var(--gold)}
.letter b{display:block;font:400 1.6rem 'Yeseva One',serif;color:#a2255f;margin-bottom:12px}
.end{text-align:center;margin-top:60px}
.end h2{font-size:2.2rem}
dialog{border:none;background:transparent;padding:0;max-width:92vw}
dialog::backdrop{background:rgba(4,22,26,.85)}
dialog img{max-width:92vw;max-height:80vh;display:block;border:10px solid #fff;border-radius:3px}
dialog p{color:var(--ink);text-align:center;font-size:1.5rem;margin:10px 0 0}
dialog button{all:unset;cursor:pointer;display:block;margin:12px auto 0;background:var(--gold);color:#1b2b2e;font-weight:600;padding:9px 22px;border-radius:999px}
dialog button:focus-visible{outline:3px solid var(--ink)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}.reveal{opacity:1;transform:none}}
</style>
</head>
<body>
<main id="m"></main>
<dialog id="dlg"><img id="di" alt=""><p class="hand" id="dp"></p><button id="dx">Close</button></dialog>

 "You make everyone feel like you have known them for ages.",
 "Your laugh is contagious.",
 "Your dancing makes me regret that I can't dance.",
 "You talk, talk and talk, and I never want you to stop.",
 "You are the person, who I am lucky to have in my life."
];

var VOICES = [
 {who:"A friend", text:"Write what this friend wants to tell her."},
 {who:"Family", text:"A message from someone in her family."},
 {who:"From her dance circle", text:"A message from a dance friend or her guru."}
];

var SONGS = [
 {t:"Song one", why:"Say why it reminds you of her."},
 {t:"Song two", why:"Say why."},
 {t:"Song three", why:"Say why."}
];

var LETTER_TITLE = "Dear " + NAME + ",";
var LETTER = "You know how bad I am at expressing a few things. But, when it comes to you, there is always one or the other thing that I can continue listing down. I have told you multiple times how much I value you, for the things you did for me. And, now I can happily say that I have told you everything, and for the first time ever, I am out of words to express. I just want you to be happy forever and always know that you had a friend who saw you as someone really special. I am always going to be around.. and always looking out for you.\n\nHappy birthday.\n\nWith all my love,\nMithuuuuuuuuun";
/* ===== END EDIT ===== */

var tilt=[-3,2,-1.5,3,-2.5,1.5],cols=["#f9d56e","#f4a9c5","#a9e0d3","#f7c08a","#c5c0f2"];
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML;}
var h='<div class="cover reveal in"><h1>For '+esc(NAME)+'</h1><p>'+esc(COVER_LINE)+'</p><div class="beads" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="hint hand" aria-hidden="true">scroll down ↓</div></div>';
h+='<section class="reveal"><h2>'+esc(STORY_TITLE)+'</h2><div class="page hand">'+esc(STORY)+'</div></section>';
h+='<section class="reveal"><h2>Moments</h2><div class="polas">'+PHOTOS.map(function(p,i){return '<button class="pola" style="--r:'+tilt[i%6]+'deg" data-i="'+i+'"><img src="'+p.img+'" alt="'+esc(p.cap)+'"><div class="cap hand">'+esc(p.cap)+'</div></button>';}).join("")+'</div></section>';
h+='<section class="reveal"><h2>What I love about you</h2><div class="notes">'+LOVE.map(function(t,i){return '<div class="note hand" style="--r:'+tilt[(i+2)%6]+'deg;--c:'+cols[i%5]+'">'+esc(t)+'</div>';}).join("")+'</div></section>';
// h+='<section class="reveal"><h2>From people who love you</h2><div class="voices">'+VOICES.map(function(v){return '<div class="voice"><span>'+esc(v.text)+'</span><b>'+esc(v.who)+'</b>'+(v.audio?'<audio controls src="'+v.audio+'"></audio>':'')+'</div>';}).join("")+'</div></section>';
// h+='<section class="reveal"><h2>Songs that are you</h2><ol class="songs">'+SONGS.map(function(s,i){return '<li><span class="n">'+(i+1)+'</span><div><strong>'+esc(s.t)+'</strong>'+esc(s.why)+'</div></li>';}).join("")+'</ol></section>';
h+='<section class="reveal"><div class="page letter hand"><b>'+esc(LETTER_TITLE)+'</b>'+esc(LETTER)+'</div></section>';
h+='<div class="end reveal"><h2>Happy birthday, '+esc(NAME)+'</h2><div class="beads" style="justify-content:center" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>';
document.getElementById("m").innerHTML=h;

var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}});},{threshold:.12});
document.querySelectorAll(".reveal").forEach(function(e){io.observe(e);});

var dlg=document.getElementById("dlg");
document.querySelectorAll(".pola").forEach(function(b){b.onclick=function(){var p=PHOTOS[b.dataset.i];document.getElementById("di").src=p.img;document.getElementById("dp").textContent=p.note||p.cap;dlg.showModal();};});
document.getElementById("dx").onclick=function(){dlg.close();};
dlg.addEventListener("click",function(e){if(e.target===dlg)dlg.close();});
