<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>10 days to go</title>
<link href="https://fonts.googleapis.com/css2?family=Yeseva+One&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f3a42;--bg2:#15505a;--ink:#f7f0e2;--gold:#e8ae3a;--rani:#d12f7e;--dim:#a9c6c4;--tile:#12444d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 Figtree,system-ui,sans-serif}
header{text-align:center;padding:48px 20px 28px;background:radial-gradient(circle at 50% 0,var(--bg2),var(--bg) 70%)}
h1{font:400 clamp(2.4rem,9vw,4.4rem)/1.05 'Yeseva One',Georgia,serif;margin:0;color:var(--gold)}
.sub{max-width:34ch;margin:14px auto 0;color:var(--dim)}
.beads{display:flex;justify-content:center;gap:6px;margin:22px 0 0}
.beads i{width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:inset -2px -2px 0 rgba(0,0,0,.25)}
.beads i:nth-child(even){background:var(--rani)}
main{max-width:720px;margin:0 auto;padding:12px 16px 56px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:12px}
button.tile{all:unset;cursor:pointer;aspect-ratio:1;border-radius:50%;background:var(--tile);border:2px solid var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--ink);transition:transform .15s}
button.tile:focus-visible{outline:3px solid var(--rani);outline-offset:3px}
button.tile:active{transform:scale(.95)}
.tile b{font:400 1.9rem/1 'Yeseva One',serif;color:var(--gold)}
.tile small{font-size:.72rem;color:var(--dim)}
.tile.open{background:var(--rani);border-color:var(--ink)}
.tile.open b{color:var(--ink)}
.tile.open small{color:var(--ink)}
.tile.locked{border-style:dashed;border-color:#4b7a7e;cursor:default}
.tile.locked b{color:#6d9598}
.finale{margin:28px 0 0;padding:22px;border:2px solid var(--gold);border-radius:18px;text-align:center}
.finale h2{font:400 1.6rem 'Yeseva One',serif;margin:0 0 6px;color:var(--gold)}
.finale p{margin:0;color:var(--dim)}
.go{display:inline-block;margin-top:16px;background:var(--gold);color:#1a2b2e;font-weight:600;text-decoration:none;padding:12px 26px;border-radius:999px}
.go:focus-visible{outline:3px solid var(--rani);outline-offset:3px}
dialog{border:2px solid var(--gold);border-radius:18px;background:var(--bg2);color:var(--ink);max-width:min(440px,92vw);padding:26px}
dialog::backdrop{background:rgba(5,25,29,.75)}
dialog h3{font:400 1.5rem 'Yeseva One',serif;margin:0 0 4px;color:var(--gold)}
dialog .k{color:var(--rani);font-weight:600;margin:0 0 12px}
dialog p.body{margin:0 0 18px;white-space:pre-line}
dialog img,dialog audio,dialog video{max-width:100%;margin:0 0 14px;border-radius:10px}
dialog button{all:unset;cursor:pointer;background:var(--gold);color:#1a2b2e;font-weight:600;padding:9px 20px;border-radius:999px}
dialog button:focus-visible{outline:3px solid var(--ink)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1 id="title">10 days to go</h1>
  <p class="sub" id="sub"></p>
  <div class="beads" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
</header>
<main>
  <div class="grid" id="grid"></div>
  <div class="finale" id="finale"></div>
</main>
<dialog id="dlg"><h3 id="dt"></h3><p class="k" id="dk"></p><div id="dm"></div><p class="body" id="db"></p><button id="dc">Close</button></dialog>

/* ===== END EDIT ===== */

var DAY = 86400000, TOTAL = BOXES.length;
var preview = location.hash.indexOf("preview") > -1;
function startOfToday(){var n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate());}
var today = startOfToday();
var daysLeft = Math.round((BIRTHDAY - today) / DAY);
var grid = document.getElementById("grid"), dlg = document.getElementById("dlg");

document.getElementById("title").textContent =
  today < START ? "Opens " + START.toLocaleDateString(undefined,{day:"numeric",month:"long"}) : daysLeft > 1 ? daysLeft + " days to go" : daysLeft === 1 ? "Tomorrow!" : daysLeft === 0 ? "Today is the day" : "Happy birthday, " + NAME;
document.getElementById("sub").textContent =
  "A little box opens for " + "you" + " every day until your birthday. Come back daily.";

BOXES.forEach(function (box, i) {
  var unlockAt = new Date(START.getTime() + i * DAY);
  var isOpen = preview || today >= unlockAt;
  var left = TOTAL - i;
  var b = document.createElement("button");
  b.className = "tile " + (isOpen ? "open" : "locked");
  b.innerHTML = "<b>" + left + "</b><small>" + (isOpen ? "open" : unlockAt.toLocaleDateString(undefined,{day:"numeric",month:"short"})) + "</small>";
  b.setAttribute("aria-label", isOpen ? "Open box, " + left + " days to go" : "Locked until " + unlockAt.toDateString());
  if (isOpen) b.addEventListener("click", function () { show(box); });
  else b.disabled = true;
  grid.appendChild(b);
});

function show(box) {
  document.getElementById("dt").textContent = box.t;
  document.getElementById("dk").textContent = box.k;
  document.getElementById("db").textContent = box.b;
  var m = document.getElementById("dm"); m.innerHTML = "";
  if (box.img) { var im = new Image(); im.src = box.img; im.alt = ""; m.appendChild(im); }
  dlg.showModal();
}
document.getElementById("dc").addEventListener("click", function () { dlg.close(); });
dlg.addEventListener("click", function (e) { if (e.target === dlg) dlg.close(); });

var f = document.getElementById("finale");
if (preview || today >= BIRTHDAY) {
  f.innerHTML = "<h2>Happy birthday, " + NAME + "!!!" + "</h2><p></p>";
  f.querySelector("p").textContent = FINALE;
  f.insertAdjacentHTML("beforeend", '<a class="go" href="scrapbook.html">Open your scrapbook</a>');
} else {
  f.innerHTML = "<h2>The big one</h2><p>Unlocks on " + BIRTHDAY.toLocaleDateString(undefined,{day:"numeric",month:"long"}) + ".</p>";
}
